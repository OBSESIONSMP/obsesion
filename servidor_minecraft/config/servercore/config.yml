# Server Core configurado para usar Clumps (XP) y Get It Together (Items)
# Most miscellaneous feature toggles.
features:
  disable-spawn-chunks: false
  prevent-moving-into-unloaded-chunks: false
  autosave-interval: 6000

  # Merge desactivado para que Clumps y Get It Together manejen XP e ítems
  xp-merge-fraction: 0
  xp-merge-radius: 0
  item-merge-radius: 0

  lobotomize-villagers:
    enabled: false
    tick-interval: 20

# Automatically modifies dynamic settings based on server performance
dynamic:
  enabled: false
  target-mspt: 35
  dynamic-settings:
    - setting: 'CHUNK_TICK_DISTANCE'
      max: 10
      min: 2
      increment: 1
      interval: 15

    - setting: 'MOBCAP_PERCENTAGE'
      max: 100
      min: 30
      increment: 10
      interval: 15

    - setting: 'SIMULATION_DISTANCE'
      max: 10
      min: 2
      increment: 1
      interval: 15

    - setting: 'VIEW_DISTANCE'
      max: 10
      min: 2
      increment: 1
      interval: 150

# Breeding cap (permanece igual)
breeding-cap:
  enabled: false
  villagers:
    limit: 32
    range: 64
  animals:
    limit: 32
    range: 64

# Mob spawning (permanece igual)
mob-spawning:
  zombie-reinforcements:
    enforce-mobcap: false
    additional-capacity: 32
  nether-portal-randomticks:
    enforce-mobcap: false
    additional-capacity: 32
  monster-spawners:
    enforce-mobcap: false
    additional-capacity: 32
  categories:
    - category: 'MONSTER'
      mobcap: 70
      spawn-interval: 1
    - category: 'CREATURE'
      mobcap: 10
      spawn-interval: 400
    - category: 'AMBIENT'
      mobcap: 15
      spawn-interval: 1
    - category: 'AXOLOTLS'
      mobcap: 5
      spawn-interval: 1
    - category: 'UNDERGROUND_WATER_CREATURE'
      mobcap: 5
      spawn-interval: 1
    - category: 'WATER_CREATURE'
      mobcap: 5
      spawn-interval: 1
    - category: 'WATER_AMBIENT'
      mobcap: 20
      spawn-interval: 1

# Commands and formatting
commands:
  status-enabled: true
  mobcaps-enabled: true
  colors:
    primary: 'dark_aqua'
    secondary: 'green'
    tertiary: 'aqua'

# Activation range settings (puedes seguir usando DPT para ticks)
activation-range:
  enabled: false
  tick-new-entities: true
  use-vertical-range: false
  skip-non-immune: false
  villager-tick-panic: true
  villager-work-immunity-after: 20
  villager-work-immunity-for: 20
  excluded-entity-types:
    - 'minecraft:warden'
    - 'minecraft:ghast'
    - 'minecraft:hopper_minecart'
  default-activation-type:
    activation-range: 16
    tick-interval: 20
    wakeup-interval: -1
    extra-height-up: false
    extra-height-down: false
  custom-activation-types:
    - name: 'raider'
      activation-range: 48
      tick-interval: 20
      wakeup-interval: 20
      extra-height-up: true
      extra-height-down: false
      entity-matcher:
        - 'typeof:raider'
    - name: 'water'
      activation-range: 16
      tick-interval: 20
      wakeup-interval: 60
      extra-height-up: false
      extra-height-down: false
      entity-matcher:
        - 'typeof:water_animal'
    - name: 'villager'
      activation-range: 16
      tick-interval: 20
      wakeup-interval: 30
      extra-height-up: false
      extra-height-down: false
      entity-matcher:
        - 'typeof:villager'
    - name: 'zombie'
      activation-range: 16
      tick-interval: 20
      wakeup-interval: 20
      extra-height-up: true
      extra-height-down: false
      entity-matcher:
        - 'minecraft:zombie'
        - 'minecraft:husk'
    - name: 'monster-below'
      activation-range: 32
      tick-interval: 20
      wakeup-interval: 20
      extra-height-up: true
      extra-height-down: true
      entity-matcher:
        - 'minecraft:creeper'
        - 'minecraft:slime'
        - 'minecraft:magma_cube'
        - 'minecraft:hoglin'
    - name: 'flying-monster'
      activation-range: 48
      tick-interval: 20
      wakeup-interval: 20
      extra-height-up: true
      extra-height-down: false
      entity-matcher:
        - 'minecraft:ghast'
        - 'minecraft:phantom'
    - name: 'monster'
      activation-range: 32
      tick-interval: 20
      wakeup-interval: 20
      extra-height-up: true
      extra-height-down: false
      entity-matcher:
        - 'typeof:monster'
    - name: 'animal'
      activation-range: 16
      tick-interval: 20
      wakeup-interval: 60
      extra-height-up: false
      extra-height-down: false
      entity-matcher:
        - 'typeof:animal'
        - 'typeof:ambient'
    - name: 'creature'
      activation-range: 24
      tick-interval: 20
      wakeup-interval: 30
      extra-height-up: false
      extra-height-down: false
      entity-matcher:
        - 'typeof:mob'
